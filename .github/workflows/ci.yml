name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
        env:
          # CI 전용 일회성 컨테이너. 암호 대신 trust 인증을 써서 자격증명 문자열을 두지 않는다.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      AGENT_OFFICE_TEST_DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/postgres
      AGENT_OFFICE_REQUIRE_DB_TESTS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            apps/server/pyproject.toml
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint and type-check
        run: |
          ruff check apps/server tests
          ruff format --check apps/server tests
          mypy apps/server/src
      - name: Test contracts and server
        run: python -m pytest apps/server/tests tests
      - name: Check dependency consistency
        run: python -m pip check

  node:
    name: Node
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  go:
    name: Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector/core
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.x"
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race ./...

  compose:
    name: Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate workflow syntax
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
      - name: Validate development Compose
        run: docker compose --env-file deploy/.env.example -f deploy/compose.yaml config --quiet
      - name: Validate production Compose
        run: docker compose --env-file deploy/.env.production.example -f deploy/compose.production.yaml config --quiet
      - name: Validate source-build Compose override
        run: docker compose --env-file deploy/.env.production.example -f deploy/compose.production.yaml -f deploy/compose.build.yaml config --quiet

  images:
    name: Images (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      COMPOSE: docker compose --env-file deploy/.env.example -f deploy/compose.yaml -p agent-office-ci
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build images natively
        run: $COMPOSE build
      - name: Start stack and wait for health checks
        run: $COMPOSE up -d --wait --wait-timeout 180
      - name: Apply database migrations from the server image
        run: |
          $COMPOSE exec -T server alembic -c /app/alembic.ini upgrade head
          $COMPOSE exec -T server alembic -c /app/alembic.ini current | grep -q "(head)"
      - name: Smoke test
        run: |
          test "$(docker image inspect agent-office-server:dev --format '{{.Architecture}}')" = "${{ matrix.arch }}"
          test "$(docker image inspect agent-office-web:dev --format '{{.Architecture}}')" = "${{ matrix.arch }}"
          test "$(docker image inspect agent-office-server:dev --format '{{.Config.User}}')" = "65532:65532"
          test "$(docker image inspect agent-office-web:dev --format '{{.Config.User}}')" = "101"
          curl --fail --silent --show-error http://127.0.0.1:8000/api/v1/system/health
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:5173/
      - name: Show service state on failure
        if: ${{ failure() }}
        run: $COMPOSE ps --all
      - name: Remove stack and test volume
        if: ${{ always() }}
        run: $COMPOSE down --volumes --remove-orphans

  e2e:
    name: E2E (browser)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build images
        run: |
          docker build -t agent-office-server:e2e apps/server
          docker build -t agent-office-web:e2e -f apps/web/Dockerfile .
      - name: Browser flows on the production Compose stack
        run: tests/e2e/run.sh agent-office-server:e2e agent-office-web:e2e

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan Git history
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: [python, node, go, compose, images, e2e, secret-scan]
    steps:
      - name: Require every CI job
        env:
          PYTHON_RESULT: ${{ needs.python.result }}
          NODE_RESULT: ${{ needs.node.result }}
          GO_RESULT: ${{ needs.go.result }}
          COMPOSE_RESULT: ${{ needs.compose.result }}
          IMAGES_RESULT: ${{ needs.images.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
        run: |
          for result in "$PYTHON_RESULT" "$NODE_RESULT" "$GO_RESULT" "$COMPOSE_RESULT" "$IMAGES_RESULT" "$E2E_RESULT" "$SECRET_SCAN_RESULT"; do
            test "$result" = "success"
          done
