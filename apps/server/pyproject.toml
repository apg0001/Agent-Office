[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-office-server"
version = "0.0.0"
description = "Agent Office FastAPI server"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.159,<0.160",
  "pydantic>=2.14,<3",
  "uvicorn[standard]>=0.54,<0.55",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<0.29",
  "jsonschema>=4.26,<5",
  "mypy>=2.4,<3",
  "pytest>=9.1,<10",
  "pyyaml>=6,<7",
  "ruff>=0.17,<0.18",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_office"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["agent_office"]
