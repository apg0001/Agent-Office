name: agent-office-dev

services:
  postgres:
    # 운영 Compose와 같은 PostgreSQL 이미지를 multi-arch digest로 고정한다.
    image: postgres:17.11-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agent_office}
      POSTGRES_USER: ${POSTGRES_USER:-agent_office}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  server:
    image: agent-office-server:dev
    build:
      context: ../apps/server
    ports:
      - "${AGENT_OFFICE_HTTP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: agent-office-web:dev
    build:
      # 루트 package-lock.json을 쓰기 위해 저장소 루트를 컨텍스트로 둔다.
      context: ..
      dockerfile: apps/web/Dockerfile
    ports:
      - "${AGENT_OFFICE_WEB_PORT:-5173}:8080"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
